<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mervin & Arita - Photo Album</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@300&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Raleway;
background:#1a0f2e;
color:white;
text-align:center;
}

h1{
font-family:'Playfair Display';
margin:30px 0;
color:#c9a84c;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.gallery img{
width:100%;
border-radius:12px;
transition:.4s;
cursor:pointer;
}

.gallery img:hover{
transform:scale(1.05);
}

/* FULL SCREEN VIEW */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.overlay img{
max-width:90%;
max-height:90%;
}
</style>
</head>

<body>

<h1>Our Memories ❤️</h1>

<div class="gallery">
<img src="images/photo1.jpg">
<img src="images/photo2.jpg">
<img src="images/photo3.jpg">
<img src="images/photo4.jpg">
<img src="images/photo5.jpg">
<!-- continue till photo50 -->
</div>

<script>
document.querySelectorAll('.gallery img').forEach(img=>{
img.onclick=()=>{
const overlay=document.createElement('div')
overlay.className='overlay'

const full=document.createElement('img')
full.src=img.src

overlay.appendChild(full)

overlay.onclick=()=>overlay.remove()

document.body.appendChild(overlay)
}
})
</script>

</body>
</html>
